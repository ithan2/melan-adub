function proofHTML(){return '<img class="proof-img" src="'+CONFIG.socialProof+'" alt="Provas sociais" onerror="this.style.display=\'none\'">'}
function startConversation(){incoming([{text:'🍉 PARABÉNS, <strong>'+userName+'</strong>! Sua compra foi APROVADA com sucesso!'},{text:'Seu material sobre <strong>cultivo de melancia</strong> já está sendo preparado. Mas antes de sair, liberei uma condição especial para quem quer organizar a <strong>adubação da lavoura com muito mais precisão</strong>.'},{text:'Em vez de ficar com anotações soltas e dúvidas sobre <strong>quando aplicar, quanto usar e quanto será necessário para a área</strong>, você pode concentrar o planejamento em um só lugar 👇'}],function(){stage=0;showOptions('Quero conhecer 🍉',null,null,false,{main:'advance'})})}
function advance(){if(busy)return;if(stage===0){sendUserMessage('Quero conhecer 🍉',function(){stage=1;incoming([{text:'Um dos maiores problemas no manejo é ter a informação, mas não conseguir transformar isso em um <strong>cronograma prático</strong>.'},{text:'❌ Não saber quanto o plano representa em <strong>kg/ha</strong><br>❌ Não calcular a <strong>quantidade total para a área</strong><br>❌ Perder datas e aplicações durante o ciclo<br>❌ Não ter controle do que já foi aplicado e do custo'},{text:'Por isso montei uma ferramenta focada no <strong>PLANEJAMENTO COMPLETO DA ADUBAÇÃO DA MELANCIA</strong> — com calculadoras, cronograma, registros e bônus 👇'}],function(){showOptions('Mostra o que vem 🎁',null,null,false,{main:'advance'})})});return}if(stage===1){sendUserMessage('Mostra o que vem 🎁',function(){stage=2;incoming([{text:productHTML(),extra:'product-card'}],function(){showOptions('Quero ver a condição 👀',null,null,false,{main:'advance'})})});return}if(stage===2){sendUserMessage('Quero ver a condição 👀',function(){stage=3;currentOffer='main';incoming([{text:'Como você <strong>acabou de comprar</strong> o material principal, essa condição fica disponível somente nesta etapa.'},{text:'<div class="strike">❌ Valor normal: R$ 57,90</div><div class="offer-price">🍉 HOJE: '+CONFIG.price+'</div><span class="tag">Pagamento único • acesso digital</span>',extra:'offer'},{text:'Você recebe o <strong>Plano Completo de Adubação</strong> + Calendário Operacional + Checklist de Manejo + Caderno de Campo + Guia de Fertirrigação.'},{text:'⚠️ A ferramenta não substitui análise de solo ou recomendação de um profissional habilitado. Ela organiza os dados e faz os cálculos a partir das informações inseridas.',extra:'warn'},{text:'⏰ Essa condição fica disponível enquanto o contador estiver ativo.'},{text:'Quer adicionar o pacote completo agora por '+CONFIG.price+'?'}],showCurrentOfferOptions)})}}
function showCurrentOfferOptions(){var label=currentOffer==='discount'?'🍉 QUERO POR '+CONFIG.discountPrice:'🍉 QUERO O PLANO POR '+CONFIG.price;showOptions(label,null,null,true,{main:'checkout'})}
function withQuery(url){var s=window.location.search;if(!s)return url;return url+(url.indexOf('?')>=0?'&':'?')+s.substring(1)}
function goCheckout(){var url=CONFIG.checkoutMain;if(currentOffer==='discount')url=CONFIG.checkoutDiscount;if(url&&url!=='#')window.location.href=withQuery(url)}
function handleQuick(btn){var a=btn.getAttribute('data-action')||'advance';if(a==='advance')advance();else if(a==='checkout')goCheckout()}
action.onclick=function(){handleQuick(action)};alt1.onclick=function(){handleQuick(alt1)};alt2.onclick=function(){handleQuick(alt2)};decline.onclick=function(){if(busy)return;if(currentOffer!=='main'){showCurrentOfferOptions();return}sendUserMessage('Não, obrigado! Quero apenas meu material principal',function(){currentOffer='discount';incoming([{text:'Entendo, <strong>'+userName+'</strong>. Hoje tá bem corrido por aqui, mas verifiquei com meu superior e consegui liberar uma condição especial para você: essa é a sua última oportunidade.'},{text:'<div class="strike">❌ '+CONFIG.price+'</div><div class="offer-price">🔥 ÚLTIMA OFERTA: '+CONFIG.discountPrice+'</div><span class="tag">Pagamento único • sem mensalidade</span>',extra:'offer'},{text:'Essa é a menor condição desta página. Se quiser aproveitar, é agora 👇'}],showCurrentOfferOptions)})};
startBtn.onclick=function(){var v=(nameInput.value||'').replace(/^\s+|\s+$/g,'');if(v)userName=v.split(/\s+/)[0];nameGate.style.display='none';hideOptions();startConversation()};nameInput.onkeydown=function(e){e=e||window.event;if((e.key&&e.key==='Enter')||e.keyCode===13)startBtn.click()};window.onresize=syncActionSpace;
setInterval(function(){if(remaining<=0)return;remaining--;var m=('0'+Math.floor(remaining/60)).slice(-2),s=('0'+remaining%60).slice(-2);timer.textContent=m+':'+s},1000);syncActionSpace();
})();
</script>
